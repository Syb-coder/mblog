spring:
    datasource:
        #schema: classpath*:scripts/schema.sql
        #continue-on-error: false
        #sql-script-encoding: utf-8
        driver-class-name: com.mysql.cj.jdbc.Driver
        url: jdbc:mysql://localhost/db_mblog?useSSL=false&characterEncoding=utf8&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
        username: root
        password: root
    flyway:
        enabled: true
    jpa:
        open-in-view: false
        database: mysql
        show-sql: false
        hibernate:
            ddl-auto: update
        properties:
            hibernate.format_sql: true
            hibernate.naming.physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
            hibernate.cache.use_second_level_cache: false
            hibernate.search.backend.type: lucene
            hibernate.search.backend.directory.type: local-filesystem
            hibernate.search.backend.directory.root: ${site.location}/storage/indexes
            hibernate.search.backend.analysis.configurer: com.mtons.mblog.config.SmartCnAnalysisConfigurer
            hibernate.search.backend.lucene_version: LATEST